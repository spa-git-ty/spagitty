<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spagitty — Merger, resolving</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden">
<dc-import name="Main" start-phase="resolve" theme="{{theme}}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
 renderVals() {
  return { theme: this.props.theme || 'dark' };
 }
}
</script>
</body>
</html>
