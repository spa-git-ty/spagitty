<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farm start — Context</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120d0b}
a{color:#f2715a;text-decoration:none}a:hover{color:#ff9a86}
button,input{font:inherit}
button{cursor:pointer}
input::placeholder{color:rgba(243,233,221,0.4)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 10px; color: #f3e9dd; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 14px; background-color: #120d0b; background-image: radial-gradient(1200px 420px at 30% -10%, rgba(242,113,90,0.16), rgba(18,13,11,0) 70%)">
  <div style="display: flex; align-items: center; gap: 6px; height: 34px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 10px; background: rgba(243,233,221,0.08); font-weight: 600">spagitty <span aria-hidden="true" style="color: rgba(243,233,221,0.62)">×</span></div>
    <div style="padding: 6px 14px; color: rgba(243,233,221,0.62)">quiblo</div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 16px; flex-grow: 1; align-items: stretch">
    <dc-import name="Rail" active="farm" hint-size="88px,900px"></dc-import>

    <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; background: #1c1613; border: 1px solid rgba(243,233,221,0.1); border-radius: 22px; padding: 22px 30px 18px; display: flex; flex-direction: column; gap: 22px">
      <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
        <div style="display: flex; align-items: baseline; gap: 14px">
          <h1 style="margin: 0; font-size: 28px; font-weight: 600">Farm</h1>
          <span style="color: rgba(243,233,221,0.62)">spagitty · new farm</span>
        </div>
        <dc-import name="Steps" step="{{ 2 }}" hint-size="560px,48px"></dc-import>
      </header>

      <div style="display: flex; flex-wrap: wrap; gap: 32px; flex-grow: 1; align-items: flex-start; justify-content: center">
        <section style="flex: 999 1 560px; min-width: 0; max-width: 780px; display: flex; flex-direction: column; gap: 18px; padding-top: 18px">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <span style="font-size: 13px; color: #f2715a; font-weight: 600">Step 2 of 4 · optional</span>
            <h2 style="margin: 0; font-size: 36px; line-height: 1.15; font-weight: 600; letter-spacing: -0.015em">Anything to start from?</h2>
            <p style="margin: 0; font-size: 15px; color: rgba(243,233,221,0.62)">The planner reads all of it, with the goal.</p>
          </div>

          <div style="background: #231c18; border: 1px solid rgba(106,167,224,0.4); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
              <div style="display: flex; align-items: center; gap: 12px">
                <span style="width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #6aa7e0; background: rgba(106,167,224,0.14)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="2"></circle></svg></span>
                <span style="font-size: 16px; font-weight: 600">Issues</span>
                <span style="font-size: 13px; color: #9cc6ee">{{ picked }} picked</span>
              </div>
              <label style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(243,233,221,0.16); background: #120d0b; width: 240px">
                <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(243,233,221,0.62)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
                <input type="search" placeholder="Search issues" aria-label="Search issues" style="border: 0; background: transparent; color: #f3e9dd; outline: none; width: 100%; font-size: 13px">
              </label>
            </div>
            <div style="display: flex; flex-direction: column">
              <sc-for list="{{ issues }}" as="i" hint-placeholder-count="5">
                <label style="display: grid; grid-template-columns: 22px 54px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 4px; border-top: 1px solid rgba(243,233,221,0.07); cursor: pointer">
                  <input type="checkbox" checked="{{ i.on }}" onChange="{{ i.toggle }}" style="width: 18px; height: 18px; accent-color: #6aa7e0">
                  <span class="mono" style="font-size: 12.5px; color: rgba(243,233,221,0.62)">#{{ i.n }}</span>
                  <span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ i.title }}</span>
                  <span style="{{ i.labelStyle }}">{{ i.label }}</span>
                </label>
              </sc-for>
            </div>
          </div>

          <div style="background: #231c18; border: 1px solid rgba(243,233,221,0.09); border-radius: 16px; padding: 16px 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
            <div style="display: flex; align-items: center; gap: 12px">
              <span style="width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #f0b54a; background: rgba(240,181,74,0.14)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"></path><path d="M9 12h6M9 16h6"></path></svg></span>
              <span style="font-size: 16px; font-weight: 600">Brief</span>
              <span class="mono" style="display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 8px; background: rgba(243,233,221,0.07); font-size: 12.5px">docs/specs/gitea.md <span style="color: rgba(243,233,221,0.62)">4 KB</span></span>
            </div>
            <div style="display: flex; gap: 8px">
              <button type="button" style="height: 34px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: rgba(243,233,221,0.62); font-size: 13px">Remove</button>
              <button type="button" style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(243,233,221,0.22); background: transparent; color: #f3e9dd; font-size: 13px">Add another</button>
            </div>
          </div>

          <div style="border: 1.5px dashed rgba(243,233,221,0.18); border-radius: 16px; padding: 16px 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
            <div style="display: flex; align-items: center; gap: 12px">
              <span style="width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #7cc68d; background: rgba(124,198,141,0.12)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="5" r="2"></circle><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="7" r="2"></circle><path d="M6 7v10M18 9c0 5-12 3-12 8"></path></svg></span>
              <div style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 16px; font-weight: 600">Branch in progress</span>
                <span style="font-size: 13px; color: rgba(243,233,221,0.62)">The farm finishes it, or splits it into tasks</span>
              </div>
            </div>
            <button type="button" style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(243,233,221,0.22); background: transparent; color: #f3e9dd; font-size: 13px">Pick a branch</button>
          </div>
        </section>

        <div style="flex: 1 1 280px; max-width: 340px; padding-top: 18px">
          <dc-import name="SoFar" step="{{ 2 }}" hint-size="100%,520px"></dc-import>
        </div>
      </div>

      <footer style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 12px 20px; border-radius: 18px; background: rgba(36,29,25,0.9); border: 1px solid rgba(243,233,221,0.1)">
        <a href="FarmGoal.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 6px; color: rgba(243,233,221,0.75)">← Goal</a>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <a href="FarmCrew.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 12px; color: #f3e9dd; border: 1px solid rgba(243,233,221,0.22)">Skip</a>
          <a href="FarmCrew.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 12px; background: #f2715a; color: #2a0e07; font-weight: 600">Continue</a>
        </div>
      </footer>
    </main>
  </div>
  <dc-import name="Dock" status="Repository ready · no farm yet" hint-size="100%,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { 142: true, 147: true, 151: true } };
  }
  renderVals() {
    const tone = { feature: '#9cc6ee', bug: '#ff8aa1', docs: '#f0b54a' };
    const raw = [
      [142, 'Gitea: list and open pull requests', 'feature'],
      [147, 'Gitea: post line comments from Review', 'feature'],
      [151, 'Crash when a repository has no commits', 'bug'],
      [149, 'hosts.md: how to add a Gitea remote', 'docs'],
      [138, 'Remember the last host picked per remote', 'feature']
    ];
    const on = this.state.on;
    const issues = raw.map(([n, title, label]) => ({
      n, title, label,
      on: !!on[n],
      toggle: () => this.setState({ on: Object.assign({}, on, { [n]: !on[n] }) }),
      labelStyle: 'font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid rgba(243,233,221,0.14); color: ' + tone[label]
    }));
    return { issues, picked: issues.filter((i) => i.on).length };
  }
}
</script>
</body>
</html>
