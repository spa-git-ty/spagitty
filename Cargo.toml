[workspace]
resolver = "2"
members = ["crates/spagitty-core", "crates/spagitty-farm", "src-tauri"]

[workspace.package]
version = "0.5.1"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-or-later"
repository = "https://github.com/Spa-git-ty/spagitty"
authors = ["Spagitty contributors"]

[workspace.dependencies]
spagitty-core = { path = "crates/spagitty-core" }
spagitty-farm = { path = "crates/spagitty-farm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
