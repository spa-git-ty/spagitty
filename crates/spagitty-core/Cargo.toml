[package]
name = "spagitty-core"
description = "Git operations for Spagitty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# gitoxide. MIT OR Apache-2.0 — clean to link into a GPL-3 work.
# Default features on purpose: they carry the hash backend and the revision,
# diff and status machinery. Trimming them means hand-picking a working set of
# roughly a dozen interdependent features for no measurable gain here.
gix = "0.86"
# The OS keychain, where a forge token lives and nowhere else (FEAT-017).
# MIT OR Apache-2.0.
#
# The *sync* secret-service backend on Linux on purpose: the async one wants a
# runtime, and this crate is deliberately blocking throughout. It links
# libdbus-1, which is why `.github/actions/linux-deps` installs it.
keyring = { version = "3.6.3", default-features = false, features = [
    "sync-secret-service",
    "apple-native",
    "windows-native",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Standard shared hook definitions (FEAT-137). MIT OR Apache-2.0.
toml = "=0.9.12"
# Manager configuration and, later, marked workflow YAML. No encoding or
# network feature is needed for UTF-8 repository files. MIT OR Apache-2.0.
yaml-rust2 = { version = "=0.10.4", default-features = false }
# Offline bundled workflow schema validation (FEAT-138). MIT, Rust 1.70.
jsonschema = { version = "=0.19.1", default-features = false }
# Bounded, linear-time GitLab rule expressions. MIT OR Apache-2.0.
regex = "1.10"
# The one HTTP client in the application (FEAT-017). MIT OR Apache-2.0.
#
# Blocking, which is what this crate already is — gix and shell are both
# synchronous and the workers are threads. reqwest would bring tokio into a
# crate with no use for it.
#
# `native-tls` rather than rustls: the platform's own TLS stack and the
# platform's own certificate store, so a desktop client behind a corporate
# proxy with a custom root works without being told about it.
#
# Reached from exactly one file, `forge/http.rs`, and there is a test that walks
# the crate to keep it that way.
ureq = { version = "3.2.1", default-features = false, features = [
    "native-tls",
    "gzip",
    "json",
] }

# Files' colour (FEAT-131): tree-sitter, its highlighter, and one grammar per
# language, compiled in. All MIT or Apache-2.0.
#
# In Rust rather than in the webview because a grammar reads the whole file,
# and a 20,000-line file should not be parsed on the thread that scrolls it.
# Each grammar is generated C and adds to the binary; the set is the one the
# proposal names (docs/proposals/workbench-and-recipes.md §6.2), less two:
# the Kotlin crate that builds against this tree-sitter ships no highlight
# query, and the Dockerfile crate is built for tree-sitter 0.20. A language
# with no grammar here falls back to `src/lib/diff/highlight.ts`.
tree-sitter-highlight = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-svelte-ng = "1.0"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"

[features]
# The repository fixtures, published for the Tauri layer's tests.
#
# `src-tauri` tests the graph worker and the session against a real repository,
# and a second fixture builder there would be a second thing to keep honest.
# Off by default, so a release build carries neither the fixtures nor tempfile.
fixture = ["dep:tempfile"]

[dependencies.tempfile]
# Fixture repositories are built in a temporary directory and removed with it,
# so tests never write anywhere a person keeps work.
version = "3"
optional = true

[dev-dependencies]
# The crate's own tests always want the fixtures.
tempfile = "3"
